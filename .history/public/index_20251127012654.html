<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETL Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="topbar">
    <div class="title">ETL Control Dashboard</div>
    <div class="meta">Manual trigger · BigQuery Load Job</div>
  </div>

  <div class="container">

    <div class="panel">
      <div class="controls">
        <div class="left">
          <button class="btn primary" id="runBtn">Run ETL</button>
          <button class="btn ghost" id="runQuietBtn">Run (Quiet)</button>
        </div>

        <div class="right">
          <label class="small">Method</label>
          <select id="method">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
          </select>

          <!-- ▼ INSERTED MODULE DROPDOWN -->
          <label class="small">Module</label>
          <select id="module">
            <option value="RAW_LOAD">Raw Load</option>
            <option value="TRANSFORM">Transform</option>
            <option value="CLEANING">Cleaning</option>
            <option value="BQ_LOAD">BigQuery Load</option>
            <option value="SUMMARY_REFRESH">Summary Refresh</option>
          </select>
          <!-- ▲ END INSERT -->

          <label class="small">Timeout (sec)</label>
          <input id="timeout" type="number" value="30" />

          <span id="serviceUrlShort"></span>
        </div>
      </div>

      <div class="status-row">
        <span id="statusPill" class="status status-wait">Idle</span>
        <span id="lastRun" class="status-info">Last run: —</span>
      </div>

      <div class="status-info" id="lastResult">Last result: —</div>
    </div>

    <div class="panel">
      <div class="log-actions">
        <button class="btn ghost" id="retryBtn">Retry</button>
        <button class="btn ghost" id="copyLogs">Copy</button>
        <button class="btn ghost" id="clearHistory">Clear</button>
      </div>

      <div class="history" id="historyList"></div>

      <div class="logbox" id="logBox">Logs will appear here...</div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
